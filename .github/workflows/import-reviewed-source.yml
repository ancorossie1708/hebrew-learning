name: Import reviewed application source

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release or draft containing the reviewed source archive
        required: true
        default: v0.6.0-build.202
      source_sha256:
        description: Verified SHA-256 of hebrew-learning-source.zip
        required: true
        default: 1377370f37afa7ec09e5f8af7f0f698013db5367dc5f517725ee10188434d176
      expected_files:
        description: Expected number of files in the source archive
        required: true
        default: '317'

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'ancorossie1708/hebrew-learning' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_SHA256: ${{ inputs.source_sha256 }}
      EXPECTED_FILES: ${{ inputs.expected_files }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Download the reviewed source archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$RELEASE_TAG" =~ ^(v[0-9][A-Za-z0-9._-]*|untagged-[a-f0-9]+)$ ]]
          mkdir -p "$RUNNER_TEMP/reviewed-source"
          gh release download "$RELEASE_TAG" --pattern hebrew-learning-source.zip --dir "$RUNNER_TEMP/reviewed-source"
      - name: Verify and import app files only
        run: |
          python - <<'PY'
          import hashlib, os, re, stat, zipfile
          from pathlib import Path, PurePosixPath
          archive=Path(os.environ['RUNNER_TEMP'])/'reviewed-source/hebrew-learning-source.zip'
          expected=os.environ['SOURCE_SHA256']
          assert re.fullmatch(r'[a-f0-9]{64}',expected), 'Invalid archive checksum'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==expected, 'Source archive checksum mismatch'
          root=Path(os.environ['GITHUB_WORKSPACE']).resolve()
          with zipfile.ZipFile(archive) as package:
              files=[item for item in package.infolist() if not item.is_dir()]
              assert len(files)==int(os.environ['EXPECTED_FILES']), 'Unexpected source archive contents'
              assert sum(item.file_size for item in files)<256*1024*1024, 'Source archive too large'
              for item in files:
                  path=PurePosixPath(item.filename)
                  assert not path.is_absolute() and '..' not in path.parts and chr(92) not in item.filename
                  assert path.parts[0] in {'.github','.gitignore','README.md','android-app','content','prototype','tools'}
                  assert not stat.S_ISLNK(item.external_attr >> 16)
                  assert not item.filename.endswith(('.p12','.pfx','.jks','.keystore'))
                  if path.parts[0]=='.github':
                      continue
                  target=root.joinpath(*path.parts).resolve()
                  assert target.is_relative_to(root)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(package.read(item))
          PY
      - name: Check the imported app
        run: |
          python tools/build_prototype.py
          python tools/sync_android_assets.py
          node tools/test_quiz_rewards.cjs
          node tools/test_quiz_feedback.cjs
          node tools/test_milestones.cjs
          node tools/test_audio_recording.cjs
      - name: Commit reviewed app to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore README.md android-app content prototype tools
          if git diff --cached --quiet; then echo 'Reviewed source is already current'; exit 0; fi
          git commit -m 'Update Hebrew Learning to 140 approved items in 14 topics'
          git push origin HEAD:main
